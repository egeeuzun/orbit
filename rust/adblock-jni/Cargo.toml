[package]
name = "adblock-jni"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
name = "adblock_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
# Varsayılan özellikler bilerek kapalı: içlerindeki `single-thread` (0.13'te
# `unsync-regex-caching`in yerini aldı) motoru Sync olmaktan çıkarır, oysa
# motor `shouldInterceptRequest`'in birden çok iş parçacığından paylaşılıyor.
# `css-validation`, prosedürel filtrelerin (`:has-text` vb.) düz CSS seçicileri
# arasına sızıp koca bir CSS bloğunu geçersiz kılmasını engeller.
adblock = { version = "0.13.5", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
    "css-validation",
] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
